[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "global_tracker"
version = "0.1.0"
description = "Global capital flow tracking and automated trading system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "influxdb-client>=1.40",
    "curl_cffi>=0.6",
    "psycopg[binary,pool]>=3.0",
    "sqlalchemy>=2.0",
    "alembic",
    "loguru",
    "requests",
    "yfinance>=0.2.0",
    "plotly",
    "pandas",
    "lxml",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tracker*"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
